version: '3.8'

services:
  backend:
    build: ./backend
    container_name: book-inventory-backend
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - CLIENT_URL=${CLIENT_URL}
      - PORT=8080
      - HOST=0.0.0.0
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: book-inventory-frontend
    ports:
      - "3000:8080"
    environment:
      - BACKEND_URL=http://backend:8080
    depends_on:
      - backend
    restart: unless-stopped